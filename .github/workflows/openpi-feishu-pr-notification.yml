name: OpenPI Feishu PR notification

on:
  workflow_call:
    secrets:
      FEISHU_PR_BOT_WEBHOOK:
        required: false
      FEISHU_PR_BOT_SECRET:
        required: false

permissions:
  contents: read
  pull-requests: read

jobs:
  notify:
    name: Notify Feishu
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ github.event_name == 'pull_request_target' && !github.event.pull_request.draft }}
    steps:
      - name: Send PR notification
        uses: openpi-dev/automation/actions/feishu-pr-notification@c631a31ed6f1851aebe0c0c20cf898f8013a5fbb
        env:
          FEISHU_PR_BOT_WEBHOOK: ${{ secrets.FEISHU_PR_BOT_WEBHOOK }}
          FEISHU_PR_BOT_SECRET: ${{ secrets.FEISHU_PR_BOT_SECRET }}
          REPOSITORY: ${{ github.repository }}
          EVENT_PATH: ${{ github.event_path }}
