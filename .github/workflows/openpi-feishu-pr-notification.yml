name: OpenPI Feishu PR notification

on:
  workflow_call:
    secrets:
      FEISHU_PR_BOT_WEBHOOK:
        required: false
      FEISHU_PR_BOT_SECRET:
        required: false

permissions:
  contents: read
  pull-requests: read

jobs:
  notify:
    name: Notify Feishu
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ github.event_name == 'pull_request_target' && !github.event.pull_request.draft }}
    steps:
      - name: Send PR notification
        uses: openpi-dev/automation/actions/feishu-pr-notification@a681421a59a9479f604717375eec01dea9f161f3
        env:
          FEISHU_PR_BOT_WEBHOOK: ${{ secrets.FEISHU_PR_BOT_WEBHOOK }}
          FEISHU_PR_BOT_SECRET: ${{ secrets.FEISHU_PR_BOT_SECRET }}
          REPOSITORY: ${{ github.repository }}
